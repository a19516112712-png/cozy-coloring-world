<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <clipPath id="c"><rect width="400" height="500" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="500" fill="#FFF8F0"/>
    <rect width="400" height="500" fill="#FFB5C2" opacity="0.25"/>
    <!-- Border pattern -->
    <rect x="10" y="10" width="380" height="480" rx="8" fill="none" stroke="#8B6B5E" stroke-width="1.5" opacity="0.15" stroke-dasharray="8 4"/>
    <!-- Emoji center -->
    <circle cx="200" cy="220" r="70" fill="white" opacity="0.8"/>
    <circle cx="200" cy="220" r="65" fill="none" stroke="#FADADD" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="200" y="235" text-anchor="middle" font-size="52">🍦</text>
    <!-- Title -->
    <text x="200" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#8B6B5E" font-weight="bold">Kawaii Ice Cream</text>
    <!-- Sparkles -->
    <text x="120" y="140" font-size="14" opacity="0.4">✨</text>
    <text x="280" y="300" font-size="12" opacity="0.4">✨</text>
    <text x="310" y="160" font-size="10" opacity="0.3">🌸</text>
    <!-- Bottom bar -->
    <rect x="0" y="440" width="400" height="60" fill="#FFB5C2" opacity="0.12"/>
    <text x="200" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8B6B5E" opacity="0.5">Free Printable Coloring Page</text>
  </g>
</svg>